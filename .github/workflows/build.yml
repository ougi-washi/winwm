name: build
on: [push, pull_request]
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check module includes for cycles
        run: |
          grep -HE '^[[:space:]]*#[[:space:]]*include[[:space:]]*"' src/*/*.[ch] |
            sed -nE 's|^src/([^/]+)/[^:]+:[[:space:]]*#[[:space:]]*include[[:space:]]*"([^"/]+)/[^"]+".*$|\1 \2|p' |
            tsort > /dev/null
      - name: Test layout and configuration without the Windows SDK
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Isrc tools/test_pointer_layout.c src/layout/{layout,gesture}.c src/model/model.c -o "$RUNNER_TEMP/layout"
          "$RUNNER_TEMP/layout"
          gcc -std=c11 -Wall -Wextra -Werror -Isrc tools/test_config.c src/config/{language,config}.c src/command/command.c src/base/json.c -o "$RUNNER_TEMP/config"
          "$RUNNER_TEMP/config"
  winwm:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit
      - shell: msys2 {0}
        run: cmd.exe //c build.bat
