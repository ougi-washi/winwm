name: build
on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check module includes for cycles
        run: |
          grep -HE '^[[:space:]]*#[[:space:]]*include[[:space:]]*"' src/*/*.[ch] |
            sed -nE 's|^src/([^/]+)/[^:]+:[[:space:]]*#[[:space:]]*include[[:space:]]*"([^"/]+)/[^"]+".*$|\1 \2|p' |
            tsort > /dev/null
  winwm:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make
          path-type: inherit
      - shell: msys2 {0}
        run: cmd.exe //c build.bat
      - name: Validate first startup with the shipped configuration
        shell: pwsh
        run: |
          $env:USERPROFILE = (New-Item -ItemType Directory "$env:RUNNER_TEMP/winwm-profile").FullName
          $env:LOCALAPPDATA = $env:USERPROFILE
          & .\bin\winwm.exe validate-startup | Out-Host
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $seed = Get-FileHash "$env:USERPROFILE/.config/winwm/winwm.lua"
          if ($seed.Hash -ne (Get-FileHash assets/winwm.lua).Hash) { throw 'First-run config differs from shipped config.' }
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref_type == 'tag'
        with:
          name: winwm-windows-x64
          path: bin/*.exe
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [portable, winwm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: winwm-windows-x64
      - name: Publish Windows x64 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          executables=(winwm.exe winwm_recovery.exe winwm_install.exe)
          zip -9 winwm-windows-x64.zip "${executables[@]}"
          gh release create "$GITHUB_REF_NAME" winwm-windows-x64.zip "${executables[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "WinWM $GITHUB_REF_NAME" \
            --notes 'Windows x64. Extract the ZIP or download all three executables to the same folder. Run `winwm.exe --preview` to try WinWM or `winwm_install.exe /install` to start it at sign-in.'
