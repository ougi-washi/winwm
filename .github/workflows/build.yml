name: build
on: [push, pull_request]
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_layers.py
      - name: Test layout and configuration without the Windows SDK
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Isrc tools/test_pointer_layout.c src/layout/{layout,gesture}.c src/model/model.c -o "$RUNNER_TEMP/layout"
          "$RUNNER_TEMP/layout"
          gcc -std=c11 -Wall -Wextra -Werror -Isrc tools/test_appearance_config.c src/config/{language,config}.c src/command/command.c src/base/json.c -o "$RUNNER_TEMP/appearance"
          "$RUNNER_TEMP/appearance"
  winwm:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
          path-type: inherit
      - name: Verify compiled module dependencies
        shell: msys2 {0}
        run: python tools/check_layers.py --linked
      - shell: msys2 {0}
        run: cmd.exe //c build.bat
