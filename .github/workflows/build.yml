name: build
on:
  push:
    branches: ['**']
    # Release tags use v0.1.YYYYMMDDHHmm in UTC.
    tags: ['v0.1.[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]']
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check file and module includes for cycles
        run: python3 tools/check_includes.py src
  winwm:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make
          path-type: inherit
      - shell: msys2 {0}
        run: cmd.exe //c build.bat
      - name: Verify single executable and standalone runtime
        shell: msys2 {0}
        run: |
          files=(bin/*.exe)
          test "${files[*]}" = bin/winwm.exe
          imports=$(objdump -p bin/winwm.exe)
          if grep -Ei 'DLL Name: (libwinpthread|libgcc|libstdc\+\+)' <<< "$imports"; then
            echo "winwm.exe requires an unshipped compiler runtime"
            exit 1
          fi
      - name: Check text rasterization, native panel geometry, and interaction
        shell: msys2 {0}
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Isrc tools/test_text_rendering.c build/obj/theme/{metrics,fonts}.o -lgdi32 -o build/test_text_rendering.exe
          ./build/test_text_rendering.exe
          gcc -std=c11 -Wall -Wextra -Werror -municode -Isrc tools/test_panel_geometry.c build/obj/theme/{theme,metrics,fonts,native_controls,hover,control_hover,disclosure,icon_button}.o build/obj/config/config.o build/obj/command/command.o build/obj/win_platform/{material,percent_slider,layer}.o -lcomctl32 -ldwmapi -luxtheme -lgdi32 -lmsimg32 -o build/test_panel_geometry.exe
          ./build/test_panel_geometry.exe bin/winwm.exe
          gcc -std=c11 -Wall -Wextra -Werror -municode -Isrc tools/test_material.c build/obj/win_platform/layer.o build/obj/config/config.o build/obj/command/command.o -lcomctl32 -ldwmapi -lgdi32 -o build/test_material.exe
          ./build/test_material.exe
      - name: Check focus across application windows, popups, and edit controls
        shell: msys2 {0}
        run: |
          gcc -std=c11 -O2 -flto -Wall -Wextra -Werror -DUNICODE -D_UNICODE -Isrc tools/test_focus.c src/model/model.c src/os_win32/os_win32.c -ldwmapi -o build/test_focus.exe
          ./build/test_focus.exe
      - name: Validate first startup with the shipped configuration
        shell: pwsh
        run: |
          $env:USERPROFILE = (New-Item -ItemType Directory "$env:RUNNER_TEMP/winwm-profile").FullName
          $env:LOCALAPPDATA = $env:USERPROFILE
          & .\bin\winwm.exe validate-startup | Out-Host
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $seed = Get-FileHash "$env:USERPROFILE/.config/winwm/winwm.lua"
          if ($seed.Hash -ne (Get-FileHash assets/winwm.lua).Hash) { throw 'First-run config differs from shipped config.' }
      - name: Install, roll back, and uninstall the standalone executable
        shell: pwsh
        run: |
          $env:USERPROFILE = "$env:RUNNER_TEMP/winwm-profile"
          $exe = (Resolve-Path bin/winwm.exe).Path
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          function Run-Setup($binary, $verb) {
            $result = Start-Process $binary -ArgumentList $verb -PassThru -Wait -WindowStyle Hidden
            if ($result.ExitCode) { throw "$verb failed ($($result.ExitCode))" }
          }
          Run-Setup $exe install
          try {
            $installed = (Get-ItemPropertyValue $run winwm).Trim('"')
            if ((Get-FileHash $installed).Hash -ne (Get-FileHash $exe).Hash) { throw 'Installed executable differs.' }
            if (@(Get-ChildItem (Split-Path $installed) -Filter '*.exe').Count -ne 1) { throw 'Expected one installed executable.' }
            Run-Setup $installed install
            if ((Get-ItemPropertyValue $run winwm).Trim('"') -ne $installed) { throw 'Reinstall changed the active slot.' }
            $second = Join-Path $env:RUNNER_TEMP 'another build.exe'
            Copy-Item $exe $second
            $stream = [IO.File]::Open($second, 'Append')
            try { $stream.WriteByte(0) } finally { $stream.Dispose() }
            Run-Setup $second install
            $updated = (Get-ItemPropertyValue $run winwm).Trim('"')
            if ($updated -eq $installed -or (Get-FileHash $updated).Hash -ne (Get-FileHash $second).Hash) { throw 'Update did not stage the new build.' }
            Run-Setup $updated rollback
            if ((Get-ItemPropertyValue $run winwm).Trim('"') -ne $installed) { throw 'Rollback did not restore the previous slot.' }
            Run-Setup $installed uninstall
            if ((Get-ItemProperty $run -ErrorAction SilentlyContinue).winwm -or (Test-Path $installed)) { throw 'Self-uninstall left the release active or on disk.' }
          } finally {
            if ((Get-ItemProperty $run -ErrorAction SilentlyContinue).winwm) { Run-Setup $exe uninstall }
          }
      - name: Check standalone startup and recovery
        shell: pwsh
        run: |
          $env:USERPROFILE = "$env:RUNNER_TEMP/winwm-profile"
          $env:LOCALAPPDATA = $env:USERPROFILE
          $exe = Join-Path $env:USERPROFILE 'winwm.exe'
          Copy-Item bin/winwm.exe $exe
          $manager = Start-Process -FilePath $exe -ArgumentList '--preview' -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 80 -and !$manager.HasExited; $i++) {
              $probe = Start-Process -FilePath $exe -ArgumentList query -WindowStyle Hidden -PassThru -Wait
              if ($probe.ExitCode -eq 0) { $ready = $true; break }
              Start-Sleep -Milliseconds 250
            }
            if (!$ready) { throw "Standalone preview failed to answer query (manager exit $($manager.ExitCode), query exit $($probe.ExitCode))." }
            $watch = @(Get-CimInstance Win32_Process -Filter "Name='winwm.exe'" | Where-Object {
              $_.ExecutablePath -eq $exe -and $_.CommandLine -like "*--recovery-watch:1:$($manager.Id):*"
            })
            if ($watch.Count -ne 1) { throw 'Expected one independent recovery process.' }
            $monitor = Get-Process -Id $watch[0].ProcessId
            $null = $monitor.Handle
            $manager.Kill()
            if (!$monitor.WaitForExit(20000) -or $monitor.ExitCode -ne 0) { throw 'Crash recovery failed.' }
          } catch {
            Write-Output "::error::$($_.Exception.Message)"
            throw
          } finally {
            if (!$manager.HasExited) { $manager.Kill() }
          }
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref_type == 'tag'
        with:
          name: winwm-windows-x64
          path: bin/winwm.exe
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [portable, winwm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: winwm-windows-x64
      - name: Publish Windows x64 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" winwm.exe \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "WinWM $GITHUB_REF_NAME" \
            --notes-from-tag
