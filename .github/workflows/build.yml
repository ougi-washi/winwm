name: build
on: [push, pull_request]
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check module includes for cycles
        run: |
          grep -HE '^[[:space:]]*#[[:space:]]*include[[:space:]]*"' src/*/*.[ch] |
            sed -nE 's|^src/([^/]+)/[^:]+:[[:space:]]*#[[:space:]]*include[[:space:]]*"([^"/]+)/[^"]+".*$|\1 \2|p' |
            tsort > /dev/null
  winwm:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make
          path-type: inherit
      - shell: msys2 {0}
        run: cmd.exe //c build.bat
      - name: Validate first startup with the shipped configuration
        shell: pwsh
        run: |
          $env:USERPROFILE = (New-Item -ItemType Directory "$env:RUNNER_TEMP/winwm-profile").FullName
          $env:LOCALAPPDATA = $env:USERPROFILE
          & .\bin\winwm.exe validate-startup | Out-Host
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $seed = Get-FileHash "$env:USERPROFILE/.config/winwm/winwm.lua"
          if ($seed.Hash -ne (Get-FileHash assets/winwm.lua).Hash) { throw 'First-run config differs from shipped config.' }
