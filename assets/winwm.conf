# Desktop configuration. Changes take effect with Super+Shift+R.
$mainMod = SUPER
$terminal = auto
$menu = Run

general {
    gaps_in = 6
    gaps_out = 6
    col.active_border = rgb(91aaf7)
    col.inactive_border = rgb(292b33)
}
decoration {
    inactive_opacity = 0.98
}
input {
    follow_mouse = 1
}
bar {
    position = top
    height = 32
    modules_left = menu workspaces mode
    modules_center = clock
    modules_right = bluetooth network audio keyboard battery
    background = rgb(101116)
    foreground = rgb(e4e5ea)
}
programs {
    terminal = $terminal
    file_browser = FilePilot.exe
    task_manager = TaskSlinger.exe
    editor = %SystemRoot%\System32\notepad.exe
}

# Start applications and manage windows.
bind = $mainMod, Return, exec, $terminal
bind = $mainMod SHIFT, q, killactive
bind = $mainMod, d, exec, $menu
bind = $mainMod, b, exec, brave
bind = $mainMod, l, movefocus, r
bind = $mainMod SHIFT, t, winwm, open_tasks
bind = $mainMod SHIFT, r, winwm, reload
bind = $mainMod SHIFT, e, winwm, confirm_sign_out
bind = $mainMod, space, winwm, focus_mode_toggle
bind = $mainMod, e, togglesplit
bind = , print, winwm, capture_region
bind = $mainMod, f6, winwm, capture_region
bind = , XF86AudioMute, winwm, mute
binde = , XF86AudioRaiseVolume, winwm, volume_up
binde = , XF86AudioLowerVolume, winwm, volume_down
bind = $mainMod, h, winwm, split horizontal
bind = $mainMod, v, winwm, split vertical
bind = $mainMod, s, winwm, layout stack
bind = $mainMod, w, winwm, layout tabs
bind = $mainMod, f, fullscreen, 0
bind = $mainMod SHIFT, space, togglefloating
bind = $mainMod, minus, winwm, scratch_show
bind = $mainMod SHIFT, minus, winwm, scratch_send
bind = $mainMod, r, submap, resize
bind = $mainMod, left, movefocus, l
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod, down, movefocus, d
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, j, movewindow, d
bind = $mainMod, up, movefocus, u
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod, right, movefocus, r
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod, 1, workspace, 1
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Adjust width or height in physical pixels. Release Super after entering the submap.
submap = resize
binde = , left, resizeactive, -100 0
binde = , h, resizeactive, -100 0
binde = , right, resizeactive, 100 0
binde = , l, resizeactive, 100 0
binde = , up, resizeactive, 0 -100
binde = , k, resizeactive, 0 -100
binde = , down, resizeactive, 0 100
binde = , j, resizeactive, 0 100
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset
